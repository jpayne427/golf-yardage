<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#064C34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../brand/favicon-64.png">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ShipStiffs">
<title>Bandon 2026 · ShipStiffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-thumb phone app — sticky title bar, scrolling panel, fixed bottom tab bar. Leaderboard-board numerals over sea-fog neutrals; team blue vs. team orange carried from the sheet. */
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --sunk:#E2E7E2; --ink:#14201A; --muted:#5A6A62; --line:#CFD8D1;
  --accent:#1E5A42; --accent-ink:#FFFFFF;
  --t1:#2C5DB0; --t1-soft:#DCE6F6; --t2:#C9611F; --t2-soft:#F7E3D4;
  --warn:#9A6A00; --warn-soft:#F6EBCB;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#16201B; --sunk:#101814; --ink:#E4EBE6; --muted:#93A39A; --line:#28362F;
  --accent:#62BE8F; --accent-ink:#0B1410;
  --t1:#86A9EE; --t1-soft:#1C2A44; --t2:#F09A5E; --t2-soft:#3A2416;
  --warn:#E2B850; --warn-soft:#352B12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16201B; --sunk:#101814; --ink:#E4EBE6; --muted:#93A39A; --line:#28362F;
  --accent:#62BE8F; --accent-ink:#0B1410;
  --t1:#86A9EE; --t1-soft:#1C2A44; --t2:#F09A5E; --t2-soft:#3A2416;
  --warn:#E2B850; --warn-soft:#352B12; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.brandwrap .brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandwrap img{height:44px;width:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.splash{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 16px;color:var(--muted)}
.splash img{width:150px;height:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--muted);font-weight:600}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.bad{color:var(--warn)}

main{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--tabh:64px}
.tabs button{border:0;background:none;min-height:var(--tabh);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;touch-action:manipulation}
.tabs button svg{width:24px;height:24px;flex:none}
.tabs button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

h2{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:0}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:14px}
.banner b{color:var(--warn)}

/* Scoreboard */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.side{padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.side.t1{background:var(--t1-soft)} .side.t2{background:var(--t2-soft)}
.side .tn{font-weight:600;font-size:14px;text-align:center;overflow-wrap:anywhere}
.side.t1 .tn{color:var(--t1)} .side.t2 .tn{color:var(--t2)}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.side .proj{font-size:12px;color:var(--muted)}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 10px;font-size:12px;color:var(--muted);text-align:center;gap:2px}
.mid b{font-family:var(--f-display);font-size:22px;color:var(--ink)}
.status-line{text-align:center;font-weight:600;font-size:14px}

table{border-collapse:collapse;width:100%}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl td.r,.tbl th.r{text-align:right}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tdot.t1{background:var(--t1)} .tdot.t2{background:var(--t2)} .tdot.none{background:var(--line)}

/* Match rows */
.mlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.mrow:last-child{border-bottom:0}
.mrow .n{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);width:26px;text-align:center}
.mrow .meta{font-size:12px;color:var(--muted)}
.mrow .who{font-size:14px;min-width:0}
.mrow .who .vs{color:var(--muted);font-size:12px;padding:0 4px}
.c1{color:var(--t1);font-weight:600} .c2{color:var(--t2);font-weight:600}
.pill{font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;justify-self:end}
.pill.t1{background:var(--t1);color:var(--surface)} .pill.t2{background:var(--t2);color:var(--surface)}
.pill.live.t1{background:var(--t1-soft);color:var(--t1)} .pill.live.t2{background:var(--t2-soft);color:var(--t2)}
.pill.half{background:var(--ink);color:var(--bg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{display:block;font-size:11px;font-weight:400;opacity:.8}
.hchip{width:42px;height:42px;padding:0;border-radius:50%;font-family:var(--f-display);font-weight:800;font-size:18px;display:grid;place-items:center;position:relative}
.hchip.done::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.hchip[aria-pressed="true"].done::after{background:var(--accent-ink)}

/* Score entry */
.hole{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hole-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);gap:10px}
.hole-h .hn{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
.hole-h .hn small{font-size:16px;color:var(--muted);margin-right:4px}
.hole-h .hp{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.hole-h .hp b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);line-height:1}
.prow{display:grid;grid-template-columns:4px 1fr auto;align-items:center;gap:0 12px;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .bar{align-self:stretch}
.prow .bar.t1{background:var(--t1)} .prow .bar.t2{background:var(--t2)}
.prow .pn{font-weight:600;min-width:0;overflow-wrap:anywhere}
.prow .ps{font-size:12px;color:var(--muted)}
.dots{color:var(--accent);letter-spacing:2px;font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:24px;font-weight:500;line-height:1}
.step .val{width:54px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:28px;display:grid;place-items:center}
.step .val.empty{color:var(--muted);font-size:14px;font-family:var(--f-body);font-weight:500}
.step .val.u{border-color:var(--accent)}
.step .pu{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.step .pu[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.livebox{display:flex;flex-direction:column;gap:6px}
.lv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.lv span:first-child{min-width:0}

/* Forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 104px 36px;gap:6px;align-items:center}
.plrow .x{border:0;background:none;color:var(--muted);font-size:20px;height:40px}
.holes-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;font-size:12px}
.holes-grid .hl{text-align:center;color:var(--muted);font-weight:600}
.holes-grid input{padding:6px 2px;text-align:center;font-size:15px}
details.card>summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--muted)}
details.card[open]>summary::after{content:"－"}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:10px 4px;font-size:13px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-top .btn{padding:8px 14px}
.hbh th,.hbh td{padding:6px 7px;text-align:center}
.hbh td:first-child,.hbh th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.hbh .w1{background:var(--t1-soft);color:var(--t1);font-weight:600}
.hbh .w2{background:var(--t2-soft);color:var(--t2);font-weight:600}
.hbh sup{color:var(--accent);font-size:9px}
.result{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.result .rt{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1.05;text-align:center}
.result.t1{background:var(--t1-soft)} .result.t1 .rt{color:var(--t1)}
.result.t2{background:var(--t2-soft)} .result.t2 .rt{color:var(--t2)}

.install{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:7;background:#14263D;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
.install img{width:34px;height:34px;border-radius:8px;flex:none}
.install p{margin:0;flex:1;font-size:15px;line-height:1.35}
.install svg.share{width:17px;height:17px;vertical-align:-3px;margin:0 2px}
.install .x{border:0;background:none;color:rgba(255,255,255,.75);font-size:26px;width:40px;height:40px;flex:none;line-height:1}
.install .go{border:0;background:#62BE8F;color:#0B1410;font-weight:700;border-radius:8px;padding:8px 12px;flex:none}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}
body{margin:0}
.mapwrap{position:fixed;left:0;right:0;top:var(--hdr,57px);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:4}
.mapwrap iframe{width:100%;height:100%;border:0;display:block}
.pinbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.pinbox .card{width:100%;max-width:360px}
.scanbox{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.scanbox .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scanbox .thumbs{display:flex;gap:8px;overflow-x:auto}
.scanbox .thumbs img{height:90px;border-radius:8px;border:1px solid var(--line)}
.scanbox .bad{outline:2px solid var(--warn);outline-offset:-2px}
.scanbox .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.scanbox .spin{animation:none}}
.scanbox .holes-grid{gap:3px}
.scanbox .holes-grid input{padding:7px 0;font-size:15px;letter-spacing:-.02em}
.issues{margin:0;padding-left:18px;color:var(--warn);font-size:14px}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.rowbtn{display:flex;gap:8px}.rowbtn .btn{flex:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
</head>
<body>

<header class="top">
  <div class="brandwrap"><a href="../" aria-label="All events"><img src="../brand/logo-200.png" alt="ShipStiffs"></a><div class="brand"><small>ShipStiffs</small>Bandon 2026 <span>Team Battle</span></div></div>
  <div id="sync" class="sync">Connecting…</div>
</header>
<main id="main"><div class="splash"><img src="../brand/logo.png" alt="ShipStiffs">Loading the scoreboard…</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 12v4M8 20h8M10 16h4v4h-4z"/></svg>Board</button>
  <button data-tab="score"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Scores</button>
  <button data-tab="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.8" y="5" width="20.4" height="14" rx="4"/><text x="12" y="16.6" text-anchor="middle" font-family="'Big Shoulders Display','Arial Narrow',Impact,sans-serif" font-weight="800" font-size="11" letter-spacing=".3" fill="currentColor" stroke="none">VS</text></svg>Matches</button>
  <button data-tab="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.4 2.5v19M13.6 2.5v19"/><path d="M18.2 7c-.9-1.5-3-2.5-6-2.5-3.5 0-6 1.6-6 3.8 0 5.2 12.2 2.9 12.2 8.4 0 2.3-2.6 3.8-6.3 3.8-3 0-5.4-1-6.4-2.8"/></svg>Games</button>
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Map</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.39 5.07 L9.82 2.24 L14.18 2.24 L14.61 5.07 L15.05 5.26 L17.36 3.56 L20.44 6.64 L18.74 8.95 L18.93 9.39 L21.76 9.82 L21.76 14.18 L18.93 14.61 L18.74 15.05 L20.44 17.36 L17.36 20.44 L15.05 18.74 L14.61 18.93 L14.18 21.76 L9.82 21.76 L9.39 18.93 L8.95 18.74 L6.64 20.44 L3.56 17.36 L5.26 15.05 L5.07 14.61 L2.24 14.18 L2.24 9.82 L5.07 9.39 L5.26 8.95 L3.56 6.64 L6.64 3.56 L8.95 5.26Z"/><circle cx="12" cy="12" r="3.1"/></svg>Setup</button>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="install" class="install" hidden role="note">
  <img src="../brand/icon-192.png" alt="">
  <p id="install-text"></p>
  <button class="go" id="install-go" hidden>Install</button>
  <button class="x" id="install-x" aria-label="Dismiss">×</button>
</div>
<div id="toast" class="toast" hidden></div>
<input id="scanfile" type="file" accept="image/*" multiple hidden>
<div id="scanbox" class="scanbox" hidden></div>
<div id="pinbox" class="pinbox" hidden>
  <form class="card" id="pinform">
    <h2>Keep score</h2>
    <p class="hint" style="margin:0">Enter the trip PIN to enter scores and change matches. Ask the organizer if you don't have it.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="Trip PIN">
    <p class="hint" id="pinmsg" style="margin:0;color:var(--warn)"></p>
    <div class="rowbtn"><button type="button" class="btn" id="pincancel">Cancel</button><button class="btn primary">Unlock</button></div>
  </form>
</div>

<script>
const FORMATS={
  fourball_mp:{label:"Four-Ball Match Play",kind:"mp",side:2,team:"best"},
  singles_mp:{label:"Singles Match Play",kind:"mp",side:1,team:"best"},
  fourball_sf:{label:"Four-Ball Stableford",kind:"sf",side:2,team:"best"},
  combined_sf:{label:"Combined Stableford",kind:"sf",side:2,team:"sum"},
  individual_sf:{label:"Individual Stableford",kind:"sf",side:1,team:"best"}
};
const DEFAULT_ALLOW={singles_mp:100,fourball_mp:90,individual_sf:100,fourball_sf:85,combined_sf:100};
const ALLOW_NOTE={
  singles_mp:"Low player plays off 0; the other gets the difference.",
  fourball_mp:"All four play off the low man.",
  individual_sf:"Full strokes, net Stableford points per hole.",
  fourball_sf:"Full strokes. Team takes the better net points per hole.",
  combined_sf:"Full strokes. Team adds both players' net points."
};

const S={db:null,user:null,readOnly:false,setup:null,players:{},courses:{},matches:{},cards:{},
  loaded:0,tab:"board",scoreRound:null,scoreGroup:null,scoreHole:null,openMatch:null,pending:{},
  confirm:null,dirty:false,err:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=Number(v);return Number.isFinite(n)?n:null};
const fmtPts=n=>{n=Math.round(n*2)/2;const w=Math.floor(n);return n%1?(w?w+"½":"½"):String(w)};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- lookups ---------- */
const rounds=()=>S.setup?.rounds||[];
const roundById=id=>rounds().find(r=>r.id===id);
const teamName=t=>S.setup?.teams?.[t]?.name||(t==="t1"?"Team 1":"Team 2");
const matchList=()=>Object.values(S.matches).sort((a,b)=>(a.n||0)-(b.n||0));
function shortName(pid){
  const p=S.players[pid];if(!p)return"—";
  const parts=String(p.name||"").trim().split(/\s+/);const first=parts[0]||"?";
  const clash=Object.entries(S.players).some(([id,q])=>id!==pid&&String(q.name||"").trim().split(/\s+/)[0]===first);
  return clash&&parts[1]?first+" "+parts[1][0]+".":first;
}
const holesOf=m=>{const a=[];for(let h=num(m.from)||1;h<=(num(m.to)||18);h++)a.push(h);return a};
const holesLabel=m=>{const f=num(m.from),t=num(m.to);if(f===1&&t===9)return"Front 9";if(f===10&&t===18)return"Back 9";if(f===1&&t===18)return"18 holes";return`Holes ${f}–${t}`};
const teeSetsOf=c=>Array.isArray(c?.teeSets)?c.teeSets:[];
const fmtTee=t=>`${t.name||"Tees"}${t.rating!=null||t.slope!=null?` · ${t.rating??"?"}/${t.slope??"?"}`:""}`;
function teeSelect(cid,id){
  const c=S.courses[cid]||{},ts=teeSetsOf(c),cur=ts.findIndex(t=>t.name===c.tees);
  return`<select id="${id}" data-set="teesel:${esc(cid)}" ${S.readOnly?"disabled":""} aria-label="Tees">${cur<0?`<option value="">Choose tees…</option>`:""}${ts.map((t,i)=>`<option value="${i}" ${i===cur?"selected":""}>${esc(fmtTee(t))}</option>`).join("")}</select>`;
}
const courseReady=c=>!!c&&Array.isArray(c.pars)&&Array.isArray(c.si)&&c.pars.length===18&&c.si.length===18&&c.pars.every(v=>num(v))&&c.si.every(v=>num(v));
function courseHcp(pid,c){
  const idx=num(S.players[pid]?.index);if(idx==null)return{v:0,est:true,missing:true};
  const sl=num(c?.slope),cr=num(c?.rating),par=num(c?.par);
  if(sl&&cr!=null&&par)return{v:Math.round(idx*sl/113+(cr-par)),est:false};
  return{v:Math.round(idx),est:true};
}
const shotsOn=(n,si)=>(!n||n<=0||!si)?0:Math.floor(n/18)+(si<=n%18?1:0);
const cardId=(round,pid)=>round+"__"+pid;
function cardVal(round,pid,h){
  const id=cardId(round,pid),pend=S.pending[id];
  if(pend&&Object.prototype.hasOwnProperty.call(pend,h))return pend[h];
  const v=S.cards[id]?.g?.[h];return v===undefined?null:v;
}

/* ---------- scoring ---------- */
function computeMatch(m){
  const f=FORMATS[m.format];
  const out={m,f,state:"unset",text:"",leader:null,final:false,result:null,thru:0,total:0,rows:[],ph:{},est:false,sides:[[],[]],tot:[0,0],diff:0};
  const sideCount=f?f.side:2;
  out.sides=[(m.t1||[]).filter(p=>S.players[p]).slice(0,sideCount),(m.t2||[]).filter(p=>S.players[p]).slice(0,sideCount)];
  if(m.manual&&m.manual.winner){
    out.final=true;out.state="final";out.manual=true;out.result=m.manual.winner;
    out.leader=m.manual.winner==="half"?null:m.manual.winner;
    out.text=m.manual.winner==="half"?"Halved":(m.manual.score?m.manual.score:"Won");
    return out;
  }
  if(!f){out.state="noformat";out.text="Format TBD";return out}
  const sides=out.sides;
  if(sides[0].length<f.side||sides[1].length<f.side){out.state="unset";out.text="Pick players";return out}
  const r=roundById(m.round),c=S.courses[r?.course];
  if(!courseReady(c)){out.state="nocourse";out.text="Needs course card";return out}
  const allow=(num(S.setup?.allowances?.[m.format])??DEFAULT_ALLOW[m.format])/100;
  const all=[...sides[0],...sides[1]];
  all.forEach(p=>{const ch=courseHcp(p,c);out.est=out.est||ch.est;out.ph[p]=Math.round(ch.v*allow)});
  if(f.kind==="mp"){const low=Math.min(...all.map(p=>out.ph[p]));all.forEach(p=>out.ph[p]-=low)}
  const holes=holesOf(m);out.total=holes.length;
  let diff=0,played=0,closed=false,lastH=null;const tot=[0,0];
  for(const h of holes){
    const par=num(c.pars[h-1]),si=num(c.si[h-1]);
    const row={h,par,si,p:{},side:[null,null],won:null,complete:true,counted:false,run:null};
    for(const p of all){
      const g=cardVal(m.round,p,h),s=shotsOn(out.ph[p],si),cell={g,s,net:null,pts:null};
      if(g==null)row.complete=false;
      else if(g==="x"){cell.pts=0}
      else{cell.net=g-s;cell.pts=Math.max(0,2+par-cell.net)}
      row.p[p]=cell;
    }
    if(row.complete&&!closed){
      played++;lastH=h;row.counted=true;
      if(f.kind==="mp"){
        const sv=sides.map(sd=>{const n=sd.map(p=>row.p[p].net).filter(v=>v!=null);return n.length?Math.min(...n):null});
        row.side=sv;
        let w="half";
        if(sv[0]!=null&&(sv[1]==null||sv[0]<sv[1]))w="t1";else if(sv[1]!=null&&(sv[0]==null||sv[1]<sv[0]))w="t2";
        row.won=w;if(w==="t1")diff++;if(w==="t2")diff--;row.run=diff;
        if(Math.abs(diff)>holes.length-played)closed=true;
      }else{
        const sv=sides.map(sd=>{const pts=sd.map(p=>row.p[p].pts);return f.team==="sum"?pts.reduce((a,b)=>a+b,0):Math.max(...pts)});
        row.side=sv;tot[0]+=sv[0];tot[1]+=sv[1];row.run=[tot[0],tot[1]];
        row.won=sv[0]>sv[1]?"t1":sv[1]>sv[0]?"t2":"half";
      }
    }
    out.rows.push(row);
  }
  out.thru=played;out.diff=diff;out.tot=tot;out.lastH=lastH;
  if(played===0){out.state="notstarted";out.text="Not started";return out}
  if(f.kind==="mp"){
    const rem=holes.length-played,a=Math.abs(diff);
    out.leader=diff>0?"t1":diff<0?"t2":null;
    out.final=closed||rem===0;
    if(out.final){out.state="final";out.result=out.leader||"half";out.text=a===0?"Halved":rem>0?`${a}&${rem}`:`${a} UP`}
    else{out.state="live";out.text=(a===0?"All square":`${a} UP`)+` thru ${lastH}`+(a>0&&a===rem?" · dormie":"")}
  }else{
    out.leader=tot[0]>tot[1]?"t1":tot[1]>tot[0]?"t2":null;
    out.final=played===holes.length;
    const hi=Math.max(tot[0],tot[1]),lo=Math.min(tot[0],tot[1]);
    if(out.final){out.state="final";out.result=out.leader||"half";out.text=out.leader?`${hi}–${lo} pts`:`Halved ${hi}–${lo}`}
    else{out.state="live";out.text=`${tot[0]}–${tot[1]} pts thru ${lastH}`}
  }
  return out;
}
function counts(m){return !!(FORMATS[m.format]||(m.manual&&m.manual.winner))}
function pointsFor(res,projected){
  const pts=num(res.m.pts)??1;
  let r=res.final?res.result:(projected&&res.state==="live"?(res.leader||"half"):null);
  if(!r)return null;
  return r==="t1"?[pts,0]:r==="t2"?[0,pts]:[pts/2,pts/2];
}
function totals(){
  const T={dec:[0,0],proj:[0,0],offered:0,decided:0,byRound:{},records:{},live:[]};
  for(const m of matchList()){
    const res=computeMatch(m);
    const rb=T.byRound[m.round]||(T.byRound[m.round]={dec:[0,0],offered:0,decided:0});
    if(counts(m)){T.offered+=num(m.pts)??1;rb.offered+=num(m.pts)??1}
    const d=pointsFor(res,false),p=pointsFor(res,true);
    if(d){T.dec[0]+=d[0];T.dec[1]+=d[1];rb.dec[0]+=d[0];rb.dec[1]+=d[1];T.decided+=d[0]+d[1];rb.decided+=d[0]+d[1]}
    if(p){T.proj[0]+=p[0];T.proj[1]+=p[1]}
    if(res.state==="live")T.live.push(res);
    if(res.final&&d){
      [0,1].forEach(i=>res.sides[i].forEach(pid=>{
        const R=T.records[pid]||(T.records[pid]={pl:0,w:0,l:0,h:0,pts:0});
        R.pl++;R.pts+=d[i];
        const mine=i===0?"t1":"t2";
        if(res.result==="half")R.h++;else if(res.result===mine)R.w++;else R.l++;
      }));
    }
  }
  return T;
}

/* ---------- rendering ---------- */
function pill(res){
  if(res.state==="final"){const c=res.result==="half"?"half":res.result;return`<span class="pill ${c}">${res.result==="half"?"Halved":esc(teamName(res.result))+" · "+esc(res.text)}</span>`}
  if(res.state==="live")return`<span class="pill live ${res.leader||""}">${esc(res.text)}</span>`;
  if(res.state==="nocourse")return`<span class="pill warn">${esc(res.text)}</span>`;
  return`<span class="pill">${esc(res.text)}</span>`;
}
function whoLine(res){
  const s=res.sides.length?res.sides:[[],[]];
  const a=s[0].map(shortName).join(" & ")||"TBD",b=s[1].map(shortName).join(" & ")||"TBD";
  return`<span class="c1">${esc(a)}</span><span class="vs">vs</span><span class="c2">${esc(b)}</span>`;
}
function matchRow(m,res){
  const r=roundById(m.round);
  return`<button class="mrow" data-act="open" data-id="${esc(m.id)}">
    <span class="n num">${esc(m.n)}</span>
    <span class="who">${whoLine(res)}<div class="meta">${esc(holesLabel(m))} · ${esc(m.group||"—")} · ${esc(FORMATS[m.format]?.label||"Format TBD")}</div></span>
    ${pill(res)}</button>`;
}

function renderBoard(){
  const T=totals(),half=T.offered/2;
  let status="No results yet";
  if(T.dec[0]>half)status=`${teamName("t1")} has won the Battle`;
  else if(T.dec[1]>half)status=`${teamName("t2")} has won the Battle`;
  else if(T.decided>0){const need=i=>half+0.5-T.dec[i];status=`${teamName("t1")} needs ${fmtPts(Math.max(0,need(0)))} · ${teamName("t2")} needs ${fmtPts(Math.max(0,need(1)))}`}
  const showProj=T.live.length>0;
  let h=`<section class="sec">
    <div class="board">
      <div class="side t1"><div class="tn">${esc(teamName("t1"))}</div><div class="big">${fmtPts(T.dec[0])}</div>${showProj?`<div class="proj">${fmtPts(T.proj[0])} projected</div>`:""}</div>
      <div class="mid"><b class="num">${fmtPts(T.decided)}/${fmtPts(T.offered)}</b>points<br>decided<br><span>${fmtPts(half+0.5)} wins</span></div>
      <div class="side t2"><div class="tn">${esc(teamName("t2"))}</div><div class="big">${fmtPts(T.dec[1])}</div>${showProj?`<div class="proj">${fmtPts(T.proj[1])} projected</div>`:""}</div>
    </div>
    <div class="status-line">${esc(status)}</div></section>`;
  if(T.live.length){
    h+=`<section class="sec"><h3>On the course</h3><div class="mlist">${T.live.map(r=>matchRow(r.m,r)).join("")}</div></section>`;
  }
  h+=`<section class="sec"><h3>By round</h3><div class="tbl"><table><thead><tr><th>Round</th><th class="r">${esc(teamName("t1"))}</th><th class="r">${esc(teamName("t2"))}</th><th class="r">Decided</th></tr></thead><tbody>`;
  for(const r of rounds()){
    const b=T.byRound[r.id]||{dec:[0,0],offered:0,decided:0};
    h+=`<tr><td>${esc(r.name)}<div class="hint">${esc(r.day)}</div></td><td class="r num c1">${b.decided?fmtPts(b.dec[0]):"–"}</td><td class="r num c2">${b.decided?fmtPts(b.dec[1]):"–"}</td><td class="r num">${fmtPts(b.decided)}/${fmtPts(b.offered)}</td></tr>`;
  }
  h+=`</tbody></table></div></section>`;
  const pl=Object.entries(S.players).sort((a,b)=>(a[1].team||"z").localeCompare(b[1].team||"z")||String(a[1].name).localeCompare(String(b[1].name)));
  h+=`<section class="sec"><h3>Individual records</h3><div class="tbl"><table><thead><tr><th>Player</th><th class="r">HCP</th><th class="r">W‑L‑H</th><th class="r">Pts</th></tr></thead><tbody>`;
  for(const [id,p] of pl){const R=T.records[id]||{w:0,l:0,h:0,pts:0};
    h+=`<tr><td><span class="tdot ${p.team||"none"}"></span>${esc(p.name)}</td><td class="r num">${num(p.index)??"–"}</td><td class="r num">${R.w}-${R.l}-${R.h}</td><td class="r num">${fmtPts(R.pts)}</td></tr>`}
  if(!pl.length)h+=`<tr><td colspan="4" class="hint">Add players on the Setup tab.</td></tr>`;
  h+=`</tbody></table></div><p class="hint">Records count finished matches only. Pts is what the player's side earned in their matches.</p></section>`;
  return h;
}

function groupsFor(round){
  const g=[];
  for(const m of matchList().filter(m=>m.round===round)){
    const key=m.group||"—";let G=g.find(x=>x.key===key);
    if(!G){G={key,matches:[],t1:[],t2:[],from:99,to:0};g.push(G)}
    G.matches.push(m);G.from=Math.min(G.from,num(m.from)||1);G.to=Math.max(G.to,num(m.to)||18);
    (m.t1||[]).forEach(p=>{if(p&&S.players[p]&&!G.t1.includes(p))G.t1.push(p)});
    (m.t2||[]).forEach(p=>{if(p&&S.players[p]&&!G.t2.includes(p))G.t2.push(p)});
  }
  return g;
}
function renderScore(){
  const rs=rounds();if(!rs.length)return`<div class="empty">No rounds yet.</div>`;
  if(!roundById(S.scoreRound))S.scoreRound=rs[0].id;
  const r=roundById(S.scoreRound),c=S.courses[r.course],ready=courseReady(c);
  const groups=groupsFor(r.id);
  if(!groups.find(g=>g.key===S.scoreGroup))S.scoreGroup=groups[0]?.key??null;
  const G=groups.find(g=>g.key===S.scoreGroup);
  let h=`<section class="sec"><div class="chips" id="rchips">${rs.map(x=>`<button class="chip" data-act="sround" data-id="${esc(x.id)}" aria-pressed="${x.id===r.id}">${esc(x.name)}<small>${esc(x.day)}</small></button>`).join("")}</div>`;
  h+=`<div class="chips">${groups.map(g=>`<button class="chip" data-act="sgroup" data-id="${esc(g.key)}" aria-pressed="${g.key===S.scoreGroup}">${esc(g.key)}<small>${esc([...g.t1,...g.t2].map(shortName).join(", ")||"no players yet")}</small></button>`).join("")}</div></section>`;
  if(teeSetsOf(c).length)h+=`<div class="field" style="flex-direction:row;align-items:center;gap:10px"><label for="score-tee" style="flex:none">Tees today</label>${teeSelect(r.course,"score-tee")}</div>`;
  if(!ready)h+=`<div class="banner"><b>No scorecard for ${esc(r.name)} yet.</b> You can still enter gross scores; net results appear once pars and stroke indexes are added on Setup.</div>`;
  if(!G)return h+`<div class="empty">No groups in this round.</div>`;
  const players=[...G.t1,...G.t2];
  if(!players.length)return h+`<div class="empty">Nobody is assigned to the ${esc(G.key)} group yet. Pick players on the Matches tab.</div>`;
  if(S.scoreHole==null||S.scoreHole<G.from||S.scoreHole>G.to){
    let first=G.from;for(let x=G.from;x<=G.to;x++){if(players.some(p=>cardVal(r.id,p,x)==null)){first=x;break}}
    S.scoreHole=first;
  }
  const hh=S.scoreHole,par=ready?num(c.pars[hh-1]):null,si=ready?num(c.si[hh-1]):null;
  h+=`<div class="chips" id="hchips">`;
  for(let x=G.from;x<=G.to;x++){const done=players.every(p=>cardVal(r.id,p,x)!=null);
    h+=`<button class="chip hchip ${done?"done":""}" data-act="shole" data-h="${x}" aria-pressed="${x===hh}" aria-label="Hole ${x}">${x}</button>`}
  h+=`</div>`;
  // strokes per player on this hole, from the match that covers it
  const covering=G.matches.filter(m=>hh>=num(m.from)&&hh<=num(m.to));
  const results=covering.map(computeMatch);
  const shots={};for(const res of results){for(const p of Object.keys(res.ph))if(shots[p]==null)shots[p]=shotsOn(res.ph[p],si)}
  h+=`<div class="hole"><div class="hole-h"><div class="hn num"><small>Hole</small>${hh}</div><div class="hp"><span>Par<b class="num">${par??"–"}</b></span><span>SI<b class="num">${si??"–"}</b></span><a href="${esc(yardUrl())}#${esc(r.course)}-${hh}" target="_blank" rel="noopener" style="align-self:center;color:var(--accent);font-weight:600;text-decoration:none">Yards ↗</a></div></div>`;
  for(const p of players){
    const v=cardVal(r.id,p,hh),team=G.t1.includes(p)?"t1":"t2",st=shots[p]||0;
    const pend=S.pending[cardId(r.id,p)]&&Object.prototype.hasOwnProperty.call(S.pending[cardId(r.id,p)],hh);
    const dis=S.readOnly?"disabled":"";
    h+=`<div class="prow"><span class="bar ${team}"></span><div><div class="pn">${esc(S.players[p].name)}</div><div class="ps">${st?`<span class="dots" aria-label="${st} stroke${st>1?"s":""}">${"●".repeat(st)}</span> gets ${st}`:"no stroke"}${v!=null&&v!=="x"&&par?` · ${v-st-par===0?"net par":(v-st-par>0?"net +"+(v-st-par):"net "+(v-st-par))}`:""}</div></div>
      <div class="step">
        <button data-act="dec" data-p="${esc(p)}" ${dis} aria-label="One fewer">−</button>
        <button class="val ${v==null||v==="x"?"empty":""} ${pend?"u":""}" data-act="setpar" data-p="${esc(p)}" ${dis} aria-label="Score">${v==null?(par?"par":"—"):v==="x"?"PU":v}</button>
        <button data-act="inc" data-p="${esc(p)}" ${dis} aria-label="One more">+</button>
        <button class="pu" data-act="pu" data-p="${esc(p)}" ${dis} aria-pressed="${v==="x"}">PU</button>
      </div></div>`;
  }
  h+=`</div><div class="navrow"><button class="btn" data-act="shole" data-h="${hh-1}" ${hh<=G.from?"disabled":""}>← Hole ${hh-1}</button><button class="btn primary" data-act="shole" data-h="${hh+1}" ${hh>=G.to?"disabled":""}>Hole ${hh+1} →</button></div>`;
  h+=`<p class="hint">Tap the middle box for par, then − or + to adjust. PU = picked up (no score on the hole).</p>`;
  h+=`<section class="sec"><h3>Matches in this group</h3><div class="mlist">${G.matches.map(m=>matchRow(m,computeMatch(m))).join("")}</div></section>`;
  return h;
}

function renderMatches(){
  let h="";
  for(const r of rounds()){
    const ms=matchList().filter(m=>m.round===r.id);if(!ms.length)continue;
    const pts=ms.filter(counts).reduce((a,m)=>a+(num(m.pts)??1),0);
    h+=`<section class="sec"><div class="rhead"><h2>${esc(r.name)}</h2><span class="hint">${esc(r.day)} · ${fmtPts(pts)} pts</span></div><div class="mlist">${ms.map(m=>matchRow(m,computeMatch(m))).join("")}</div></section>`;
  }
  if(!h)h=`<div class="empty">No matches yet.</div>`;
  if(!S.readOnly)h+=`<button class="btn" data-act="addmatch">Add a match</button>`;
  return h;
}

function renderSetup(){
  const dis=S.readOnly?"disabled":"";
  let h="";

  h+=`<section class="sec"><h2>Teams</h2><div class="card grid2">${["t1","t2"].map(t=>`<div class="field"><label for="tn-${t}"><span class="tdot ${t}"></span>${t==="t1"?"Team 1":"Team 2"} name</label><input id="tn-${t}" type="text" value="${esc(teamName(t))}" data-set="team:${t}" ${dis}></div>`).join("")}</div></section>`;
  const pl=Object.entries(S.players).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name)));

const SKIN_DEFAULT={allow:100,offLow:false,carry:true,buyin:0};
const skinCfg=()=>({...SKIN_DEFAULT,...(S.setup?.skins||{})});
const money=n=>"$"+(Math.round(n*100)/100).toFixed(n%1?2:0);
function skinPlayers(round){
  const set=new Set();
  matchList().filter(m=>m.round===round).forEach(m=>[...(m.t1||[]),...(m.t2||[])].forEach(p=>{if(p&&S.players[p])set.add(p)}));
  Object.values(S.cards).forEach(c=>{if(c.round===round&&S.players[c.pid]&&c.g&&Object.values(c.g).some(v=>v!=null))set.add(c.pid)});
  return [...set];
}
function computeSkins(round){
  const cfg=skinCfg(),r=roundById(round),c=S.courses[r?.course];
  const out={round,players:skinPlayers(round),holes:[],won:{},skins:0,carry:0,ready:courseReady(c),ph:{},est:false,done:0};
  if(!out.ready||out.players.length<2)return out;
  out.players.forEach(p=>{const ch=courseHcp(p,c);out.est=out.est||ch.est;out.ph[p]=Math.round(ch.v*(num(cfg.allow)??100)/100)});
  if(cfg.offLow){const low=Math.min(...out.players.map(p=>out.ph[p]));out.players.forEach(p=>out.ph[p]-=low)}
  let carry=0;
  for(let h=1;h<=18;h++){
    const par=num(c.pars[h-1]),si=num(c.si[h-1]);
    const row={h,par,si,state:"open",winner:null,net:null,gross:null,value:0,missing:0,tied:[]};
    const nets=[];
    for(const p of out.players){const g=cardVal(round,p,h);if(g==null){row.missing++;continue}if(g!=="x")nets.push({p,g,net:g-shotsOn(out.ph[p],si)})}
    if(row.missing){row.carryIn=carry;out.holes.push(row);continue}
    out.done++;
    const best=nets.length?Math.min(...nets.map(x=>x.net)):null;
    const top=nets.filter(x=>x.net===best);
    if(top.length===1){row.state="won";row.winner=top[0].p;row.net=best;row.gross=top[0].g;row.value=1+(cfg.carry?carry:0);
      out.won[row.winner]=(out.won[row.winner]||0)+row.value;out.skins+=row.value;carry=0}
    else{row.state="tie";row.net=best;row.tied=top.map(x=>x.p);if(cfg.carry)carry++}
    out.holes.push(row);
  }
  out.carry=carry;out.pot=(num(cfg.buyin)||0)*out.players.length;
  return out;
}
function renderGames(){
  const rs=rounds();if(!rs.length)return`<div class="empty">No rounds yet.</div>`;
  if(!roundById(S.gameRound))S.gameRound=S.scoreRound&&roundById(S.scoreRound)?S.scoreRound:rs[0].id;
  const cfg=skinCfg(),r=roundById(S.gameRound),K=computeSkins(r.id);
  let h=`<section class="sec"><div class="rhead"><h2>Skins</h2><span class="hint">${num(cfg.allow)??100}% hcp${cfg.offLow?" off low":", full strokes"} · ${cfg.carry?"carryovers":"no carryovers"}${num(cfg.buyin)?` · ${money(num(cfg.buyin))} buy-in`:""}</span></div>
    <div class="chips">${rs.map(x=>`<button class="chip" data-act="ground" data-id="${esc(x.id)}" aria-pressed="${x.id===r.id}">${esc(x.name)}<small>${esc(x.day)}</small></button>`).join("")}</div></section>`;
  if(!K.ready)return h+`<div class="empty">Skins start once ${esc(r.name)} has pars and stroke indexes on Setup.</div>`;
  if(K.players.length<2)return h+`<div class="empty">Skins start once players are assigned to ${esc(r.name)} matches.</div>`;
  const per=K.skins?K.pot/K.skins:0;
  const ranked=K.players.map(p=>({p,n:K.won[p]||0})).sort((a,b)=>b.n-a.n||String(S.players[a.p].name).localeCompare(S.players[b.p].name));
  h+=`<section class="sec"><div class="tbl"><table><thead><tr><th>Player</th><th class="r">Strokes</th><th class="r">Skins</th>${K.pot?`<th class="r">Won</th>`:""}</tr></thead><tbody>`;
  for(const x of ranked){const t=S.players[x.p].team;h+=`<tr><td><span class="tdot ${t||"none"}"></span>${esc(S.players[x.p].name)}</td><td class="r num">${K.ph[x.p]}</td><td class="r num"><b>${x.n||"–"}</b></td>${K.pot?`<td class="r num">${x.n?money(x.n*per):"–"}</td>`:""}</tr>`}
  h+=`</tbody></table></div><p class="hint">${K.skins} skin${K.skins===1?"":"s"} won through ${K.done} complete hole${K.done===1?"":"s"}${K.carry?` · ${K.carry} carrying over`:""}${K.pot?` · pot ${money(K.pot)}, ${K.skins?money(per)+" per skin so far":"no skins yet"}`:""}${K.est?" · strokes estimated until rating/slope are in":""}. A hole is decided once all ${K.players.length} players have a score.</p></section>`;
  h+=`<section class="sec"><h3>Hole by hole</h3><div class="mlist">`;
  for(const x of K.holes){
    let res;
    if(x.state==="won")res=`<span class="pill ${S.players[x.winner].team||""}">${esc(shortName(x.winner))} · net ${x.net}${x.value>1?` · ${x.value} skins`:""}</span>`;
    else if(x.state==="tie")res=`<span class="pill">${x.net==null?"All picked up":`Tied at net ${x.net} (${x.tied.length})`}${cfg.carry?" · carries":""}</span>`;
    else res=`<span class="pill">${x.missing} score${x.missing===1?"":"s"} to come</span>`;
    h+=`<div class="lv" style="border:0;border-bottom:1px solid var(--line);border-radius:0"><span><b class="num">${x.h}</b> <span class="hint">Par ${x.par} · SI ${x.si}</span></span>${res}</div>`;
  }
  h+=`</div>${K.carry&&K.done===18?`<p class="hint">${K.carry} skin${K.carry>1?"s":""} still tied after 18. Settle it however the group likes.</p>`:""}</section>`;
  // trip totals
  const trip={};rs.forEach(x=>{const k=computeSkins(x.id);const pp=k.skins?k.pot/k.skins:0;Object.entries(k.won).forEach(([p,n])=>{const t=trip[p]||(trip[p]={n:0,$:0});t.n+=n;t.$+=n*pp})});
  const tl=Object.entries(trip).sort((a,b)=>b[1].n-a[1].n);
  if(tl.length){h+=`<section class="sec"><h3>Trip total</h3><div class="tbl"><table><tbody>${tl.map(([p,t])=>`<tr><td><span class="tdot ${S.players[p]?.team||"none"}"></span>${esc(S.players[p]?.name||"")}</td><td class="r num">${t.n} skin${t.n===1?"":"s"}</td>${num(cfg.buyin)?`<td class="r num">${money(t.$)}</td>`:""}</tr>`).join("")}</tbody></table></div></section>`}
  return h;
}

function setSync(t,bad){const s=$("#sync");s.textContent=t;s.classList.toggle("bad",!!bad)}
/* Supabase-backed store with the same small API the page was written against:
   db.doc("col/id").get/set/update/delete/onSnapshot and db.collection("col").onSnapshot. */
function deepMerge(a,b){if(a&&b&&typeof a==="object"&&typeof b==="object"&&!Array.isArray(a)&&!Array.isArray(b)){const o={...a};for(const k of Object.keys(b))o[k]=k in a?deepMerge(a[k],b[k]):b[k];return o}return b}
function makeStore(sb){
  const cache={},subs=[];
  const docSnap=(c,id)=>({id,exists:!!(cache[c]&&cache[c][id]),data:()=>cache[c]&&cache[c][id]});
  const collSnap=c=>({docs:Object.entries(cache[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d}))});
  const emit=c=>subs.forEach(l=>{if(l.c===c)l.fn(l.id?docSnap(c,l.id):collSnap(c))});
  const put=(c,id,d)=>{(cache[c]||(cache[c]={}))[id]=d};
  async function loadAll(){
    const {data,error}=await sb.from("docs").select("collection,id,data");
    if(error)throw error;
    for(const k of Object.keys(cache))cache[k]={};
    data.forEach(r=>put(r.collection,r.id,r.data));
    ["setup","players","courses","matches","cards"].forEach(emit);
  }
  async function rpc(c,id,d,mode){
    const {error}=await sb.rpc("write_doc",{p_pin:S.pin||"",p_collection:c,p_id:id,p_data:d||{},p_mode:mode});
    if(error)throw /wrong pin/i.test(error.message||"")?{code:"wrong_pin"}:{code:"unavailable",message:error.message};
  }
  const split=p=>{const i=p.indexOf("/");return[p.slice(0,i),p.slice(i+1)]};
  return{
    loadAll,
    listen(onState){
      return sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
        const r=p.new&&p.new.collection?p.new:p.old;
        if(!r||!r.collection)return;
        if(p.eventType==="DELETE"){if(cache[r.collection])delete cache[r.collection][r.id]}else put(r.collection,r.id,r.data);
        emit(r.collection);
      }).subscribe(onState);
    },
    doc(path){const [c,id]=split(path);return{
      get:async()=>docSnap(c,id),
      set:async d=>{put(c,id,d);emit(c);await rpc(c,id,d,"set")},
      update:async d=>{put(c,id,deepMerge((cache[c]||{})[id]||{},d));emit(c);await rpc(c,id,d,"update")},
      delete:async()=>{if(cache[c])delete cache[c][id];emit(c);await rpc(c,id,null,"delete")},
      onSnapshot(fn){const l={c,id,fn};subs.push(l);if(cache[c])fn(docSnap(c,id));return()=>subs.splice(subs.indexOf(l),1)}
    }},
    collection(c){return{onSnapshot(fn){const l={c,fn};subs.push(l);if(cache[c])fn(collSnap(c));return()=>subs.splice(subs.indexOf(l),1)}}}
  };
}

const SCAN={};
function shrink(file){ // phone photos are huge: send a 1600px JPEG instead
  return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      const d=c.toDataURL("image/jpeg",0.85);res({preview:d,media_type:"image/jpeg",data:d.split(",")[1]})};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That file isn't a photo the browser can open."))};img.src=url});
}
function scanView(html){const el=$("#scanbox");el.innerHTML=`<div class="in">${html}</div>`;el.hidden=false;el.scrollTop=0}
function closeScan(){$("#scanbox").hidden=true;$("#scanbox").innerHTML=""}
// Photos collect in a tray first, so the camera can take front and back before sending.
SCAN.tray=[];
function scanName(){const r=rounds().find(x=>x.course===S.scanCourse);return S.courses[S.scanCourse]?.name||r?.name||{pacific:"Pacific Dunes"}[S.scanCourse]||"this course"}
function drawTray(msg){
  const n=SCAN.tray.length;
  scanView(`<div class="rhead"><h2>Scan ${esc(scanName())}</h2><button class="btn" data-scan="close" style="padding:8px 12px">Cancel</button></div>
    <p class="hint" style="margin:0">${n} photo${n===1?"":"s"} ready. Add the other side of the card if it has one (up to 4 photos), then read the card.</p>
    ${msg?`<div class="banner">${msg}</div>`:""}
    <div class="thumbs">${SCAN.tray.map((i,k)=>`<div style="position:relative"><img src="${i.preview}" alt="Scorecard photo ${k+1}"><button class="btn" data-scan="drop" data-k="${k}" aria-label="Remove photo ${k+1}" style="position:absolute;top:4px;right:4px;padding:2px 8px">×</button></div>`).join("")}</div>
    <div class="rowbtn"><button class="btn" data-scan="more" ${n>=4?"disabled":""}>Add another photo</button><button class="btn primary" data-scan="read" ${n?"":"disabled"}>Read the card</button></div>`);
}
$("#scanfile").addEventListener("change",async e=>{

async function readCard(){
  const imgs=SCAN.tray;
  scanView(`<h2>Scan ${esc(scanName())}</h2><div style="display:flex;gap:12px;align-items:center"><div class="spin" aria-hidden="true"></div><span>Reading the card… this takes about 15–40 seconds.</span></div>
    <div class="thumbs">${imgs.map(i=>`<img src="${i.preview}" alt="Scorecard photo">`).join("")}</div>`);
  const cfg=window.BATTLE_CONFIG||{};
  try{
    const resp=await fetch(cfg.url+"/functions/v1/scan-scorecard",{method:"POST",headers:{"Content-Type":"application/json",apikey:cfg.anonKey,Authorization:"Bearer "+cfg.anonKey},
      body:JSON.stringify({pin:S.pin,images:imgs.map(({media_type,data})=>({media_type,data}))})});
    const out=await resp.json().catch(()=>({error:`The scan service didn't answer properly (HTTP ${resp.status}).`}));
    if(resp.status===403&&out.error==="wrong_pin"){closeScan();writeFailed({code:"wrong_pin"});return}
    if(!resp.ok||!out.card){const e=new Error(out.error||"The scan didn't work.");e.details=out.details;throw e}
    SCAN.imgs=imgs;SCAN.tray=[];SCAN.trayFor=null;

  }catch(err){
    const det=(err.details||[]).map(d=>`<li>${esc(d)}</li>`).join("");

      <div class="rowbtn"><button class="btn" data-scan="close">Close</button><button class="btn primary" data-scan="read">Try again</button></div>`);
  }
}
function loadCard(card){
  const h={};(card?.holes||[]).forEach(x=>{if(x.hole>=1&&x.hole<=18)h[x.hole]=x});
  const tees=card?.tees||[];SCAN.card=card;
  SCAN.pars=Array.from({length:18},(_,i)=>h[i+1]?.par??null);
  SCAN.si=Array.from({length:18},(_,i)=>h[i+1]?.si??null);
  const playing=(S.courses[S.scanCourse]?.tees||"").toLowerCase();   // default to the tees this course already plays
  SCAN.tee=Math.max(0,tees.findIndex(t=>(t.name||"").toLowerCase()===playing));

}
function scanIssues(){
  const iss=[],pars=SCAN.pars,si=SCAN.si;
  const missP=pars.map((v,i)=>v==null?i+1:null).filter(Boolean),missS=si.map((v,i)=>v==null?i+1:null).filter(Boolean);
  if(missP.length)iss.push(`No par for hole${missP.length>1?"s":""} ${missP.join(", ")}`);
  if(missS.length)iss.push(`No stroke index for hole${missS.length>1?"s":""} ${missS.join(", ")}`);
  const seen={};si.forEach(v=>{if(v!=null)seen[v]=(seen[v]||0)+1});
  const dup=Object.keys(seen).filter(k=>seen[k]>1);if(dup.length)iss.push(`Stroke index used twice: ${dup.join(", ")}`);
  if(si.some(v=>v!=null&&(v<1||v>18)))iss.push("Stroke index must be 1–18");
  if(pars.some(v=>v!=null&&(v<3||v>6)))iss.push("A par looks wrong (should be 3, 4 or 5)");
  const tot=pars.reduce((a,v)=>a+(v||0),0);if(!missP.length&&(tot<66||tot>74))iss.push(`Par adds up to ${tot}. Check it`);
  if(SCAN.rating==null||SCAN.slope==null)iss.push("Rating or slope missing for the chosen tee");
  return iss;
}
function drawReview(){
  const card=SCAN.card,tees=card.tees||[],iss=scanIssues(),tot=SCAN.pars.reduce((a,v)=>a+(v||0),0);
  const dupSet=new Set();const seen={};SCAN.si.forEach(v=>{if(v!=null){if(seen[v])dupSet.add(v);seen[v]=1}});
  const cell=(k,i)=>{const v=SCAN[k][i];const bad=v==null||(k==="si"&&dupSet.has(v));
    return`<input type="number" inputmode="numeric" aria-label="Hole ${i+1} ${k==="si"?"stroke index":"par"}" value="${v??""}" data-scancell="${k}:${i}" class="${bad?"bad":""}" ${k==="si"?'style="background:var(--sunk)"':""}>`};
  let h=`<div class="rhead"><h2>Check the card</h2><button class="btn" data-scan="close" style="padding:8px 12px">Cancel</button></div>
    <p class="hint" style="margin:0">Read from ${SCAN.imgs.length} photo${SCAN.imgs.length>1?"s":""}${card.course_name?` of <b>${esc(card.course_name)}</b>`:""}. Fix anything highlighted, then save.</p>
    <div class="thumbs">${SCAN.imgs.map(i=>`<img src="${i.preview}" alt="Scorecard photo">`).join("")}</div>`;
  h+=iss.length?`<div class="banner"><b>Check these:</b><ul class="issues">${iss.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div class="banner" style="background:var(--t1-soft)">Everything adds up. Par ${tot}, stroke index 1–18 used once each.</div>`;
  h+=`<section class="card"><div class="field"><label for="scantee">Tees you're playing</label><select id="scantee">${tees.map((t,i)=>`<option value="${i}" ${i===SCAN.tee?"selected":""}>${esc(t.name)}${t.rating!=null||t.slope!=null?` · ${t.rating??"?"}/${t.slope??"?"}`:""}</option>`).join("")||"<option>No tees found</option>"}</select></div>
    <div class="grid2"><div class="field"><label for="scanrating">Rating</label><input id="scanrating" type="number" step="0.1" inputmode="decimal" value="${SCAN.rating??""}" class="${SCAN.rating==null?"bad":""}"></div>
    <div class="field"><label for="scanslope">Slope</label><input id="scanslope" type="number" inputmode="numeric" value="${SCAN.slope??""}" class="${SCAN.slope==null?"bad":""}"></div></div></section>`;
  h+=`<section class="card">`;
  for(const half of [[0,9],[9,18]]){h+=`<div class="holes-grid">`;
    for(let i=half[0];i<half[1];i++)h+=`<span class="hl">${i+1}</span>`;
    for(let i=half[0];i<half[1];i++)h+=cell("pars",i);
    for(let i=half[0];i<half[1];i++)h+=cell("si",i);h+=`</div>`}
  h+=`<p class="hint" style="margin:0">Top row par (total ${tot}), shaded row stroke index.</p></section>`;
  if(card.notes)h+=`<p class="hint" style="margin:0"><b>Scanner notes:</b> ${esc(card.notes)}</p>`;
  h+=`<div class="rowbtn"><button class="btn" data-scan="retry">Rescan</button><button class="btn primary" data-scan="save">Save to course</button></div>`;
  scanView(h);
}
$("#scanbox").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.scancell){const [k,i]=t.dataset.scancell.split(":");SCAN[k][+i]=num(t.value);drawReview()}
  else if(t.id==="scantee"){SCAN.tee=+t.value;const tee=(SCAN.card.tees||[])[SCAN.tee]||{};SCAN.rating=tee.rating??null;SCAN.slope=tee.slope??null;drawReview()}
  else if(t.id==="scanrating"){SCAN.rating=num(t.value);drawReview()}
  else if(t.id==="scanslope"){SCAN.slope=num(t.value);drawReview()}
});
$("#scanbox").addEventListener("click",e=>{
  const a=e.target.closest("[data-scan]");if(!a)return;
  if(a.dataset.scan==="close"){closeScan();SCAN.tray=[];SCAN.trayFor=null}
  else if(a.dataset.scan==="retry"){SCAN.tray=[];SCAN.trayFor=S.scanCourse;$("#scanfile").value="";$("#scanfile").click()}
  else if(a.dataset.scan==="more"){$("#scanfile").value="";$("#scanfile").click()}
  else if(a.dataset.scan==="drop"){SCAN.tray.splice(+a.dataset.k,1);drawTray()}
  else if(a.dataset.scan==="read"){if(SCAN.tray.length)readCard()}
  else if(a.dataset.scan==="save"){
    const cid=S.scanCourse,tee=(SCAN.card.tees||[])[SCAN.tee]||{};
    const teeSets=(SCAN.card.tees||[]).map((t,i)=>({name:t.name,rating:i===SCAN.tee?SCAN.rating:(t.rating??null),slope:i===SCAN.tee?SCAN.slope:(t.slope??null),par:t.par??null}));
    const data={pars:SCAN.pars,si:SCAN.si,par:SCAN.pars.every(v=>v!=null)?SCAN.pars.reduce((x,y)=>x+y,0):null,rating:SCAN.rating,slope:SCAN.slope,tees:tee.name||"",teeSets,source:"Scanned from the scorecard"};
    if(!S.courses[cid]?.name)data.name={pacific:"Pacific Dunes"}[cid]||SCAN.card.course_name||cid;
    updDoc("courses/"+cid,data);closeScan();S.openCourse=cid;render();toast("Saved. Check the course card on Setup.");
  }
});
function openPin(){$("#pinmsg").textContent="";$("#pin").value="";$("#pinbox").hidden=false;setTimeout(()=>$("#pin").focus(),50)}
$("#pincancel").onclick=()=>{$("#pinbox").hidden=true};
$("#pinform").addEventListener("submit",async e=>{
  e.preventDefault();const pin=$("#pin").value.trim();if(!pin)return;
  $("#pinmsg").textContent="Checking…";
  const {data,error}=await S.sb.rpc("check_pin",{p_pin:pin});
  if(error){$("#pinmsg").textContent="Couldn't check the PIN. Check your connection and try again.";return}
  if(!data){$("#pinmsg").textContent="That PIN isn't right.";return}
  S.pin=pin;ls.set("pin",pin);S.readOnly=false;$("#pinbox").hidden=true;setSync("Live");render();toast("Unlocked. You can keep score on this phone.");
});
async function boot(){
  S.tab=ls.get("tab")||"board";S.scoreRound=ls.get("sround");S.scoreGroup=ls.get("sgroup");
  render();
  const cfg=window.BATTLE_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey){S.err="The scoreboard isn't connected to its database yet.";setSync("Offline",true);render();return}
  S.sb=supabase.createClient(cfg.url,cfg.anonKey);
  const db=makeStore(S.sb);S.db=db;
  S.pin=ls.get("pin")||"";S.readOnly=!S.pin;
  const mark=k=>{if(!S["_"+k]){S["_"+k]=1;S.loaded++}};
  db.doc("setup/main").onSnapshot(s=>{S.setup=s.exists?s.data():null;mark("setup");render()});
  const coll=(name,key)=>db.collection(name).onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]={...d.data(),id:d.id}});S[key]=o;mark(key);render()});
  coll("players","players");coll("courses","courses");coll("matches","matches");coll("cards","cards");
  db.listen(st=>{if(st==="SUBSCRIBED")setSync(S.readOnly?"View only":"Live",S.readOnly);else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT")setSync("Reconnecting…",true)});
  try{await db.loadAll()}catch(e){S.err="Couldn't load the scoreboard. Check your connection and reload.";setSync("Offline",true);render();return}
  // phones sleep and drop the live connection: catch up whenever the app comes back
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")db.loadAll().catch(()=>{})});
  setInterval(()=>{if(document.visibilityState==="visible")db.loadAll().catch(()=>{})},60000);
  if(S.tab==="score")wake();
}
/* "Add to Home Screen" nudge: only in a normal browser tab, until dismissed */
(function(){
  const standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(standalone||window.top!==window.self||ls.get("installDismissed"))return;
  const el=$("#install"),txt=$("#install-text");
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const shareIcon='<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  if(ios)txt.innerHTML=`Get the full-screen app: tap Share ${shareIcon}, then <b>Add to Home Screen</b>.`;
  else if(/android/i.test(navigator.userAgent))txt.innerHTML="Get the full-screen app: tap the browser menu <b>⋮</b>, then <b>Add to Home screen</b>.";
  else return; // desktop: no nudge
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;txt.innerHTML="Get the full-screen app on your home screen.";$("#install-go").hidden=false});
  $("#install-go").onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;el.hidden=true};
  $("#install-x").onclick=()=>{el.hidden=true;ls.set("installDismissed","1")};
  el.hidden=false;
})();
(function(){const fit=()=>{const t=document.querySelector(".top");if(t)document.documentElement.style.setProperty("--hdr",t.getBoundingClientRect().bottom+"px")};
  fit();addEventListener("resize",fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit)})();
boot();
</script>
