<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1411">
<title>Golf Yardage</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Full-bleed satellite map; hole bar on top, yardage panel at the bottom. Always dark so it reads over imagery and in sun glare. */
:root{
  --bg:#0D1411; --panel:rgba(13,20,17,.92); --ink:#EEF3EF; --muted:#9FB0A6; --line:rgba(255,255,255,.14);
  --accent:#62BE8F; --me:#3D8BFF; --pin:#FFD23F; --warn:#F09A5E;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;background:#111}
.num{font-variant-numeric:tabular-nums}

.bar{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}
.bar select{flex:1;min-width:0;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-size:16px}
.bar select option{background:#16201B}
.holenav{display:flex;align-items:center;gap:4px}
.holenav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:20px}
.holenav .h{min-width:52px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.holenav .h small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted)}

.panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(6px)}
.fmb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fmb div{text-align:center;border-radius:10px;background:rgba(255,255,255,.05);padding:6px 4px}
.fmb label{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fmb b{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}
.fmb .m b{color:var(--accent);font-size:46px}
.msg{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.msg.warn{color:var(--warn)}
.tools{display:flex;gap:6px}
.tools button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:600}
.tools button[aria-pressed="true"]{background:var(--pin);color:#111;border-color:var(--pin)}
.tools a{flex:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}

.fab{position:fixed;right:12px;z-index:1000;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.fab svg{width:22px;height:22px}

.me-dot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.pin{width:20px;height:20px;border-radius:50%;background:var(--pin);border:3px solid #111;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.gpt{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-body);color:#111;border:2px solid #111}
.gpt.F{background:#CDEFD9}.gpt.M{background:var(--accent)}.gpt.B{background:#2E7A55;color:#fff}
.ylabel{background:rgba(0,0,0,.78);color:#fff;border-radius:8px;padding:3px 8px;font:800 20px var(--f-display);white-space:nowrap;border:1px solid rgba(255,255,255,.25)}
.ylabel small{font:600 11px var(--f-body);color:#ccc;margin-left:2px}
.leaflet-div-icon{background:none;border:0}
.leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.5)!important;color:#ccc!important}
.leaflet-control-attribution a{color:#ddd!important}

.modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-in{width:100%;max-width:520px;background:#16201B;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.modal h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:0;font-size:22px}
.modal p{margin:0;color:var(--muted);font-size:14px}
.modal textarea{width:100%;min-height:160px;background:#0D1411;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:10px;font-weight:600}
.row button.primary{background:var(--accent);color:#0B1410;border-color:var(--accent)}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Satellite map"></div>

<div class="bar">
  <select id="course" aria-label="Course"></select>
  <div class="holenav">
    <button id="prev" aria-label="Previous hole">‹</button>
    <div class="h num"><small>HOLE</small><span id="hole">1</span></div>
    <button id="next" aria-label="Next hole">›</button>
  </div>
</div>

<button class="fab" id="locate" aria-label="Center on me" style="top:calc(env(safe-area-inset-top,0px) + 70px)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>
<button class="fab" id="togreen" aria-label="Show the green" style="top:calc(env(safe-area-inset-top,0px) + 126px)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 21V3l11 4-11 4"/></svg>
</button>

<div class="panel">
  <div class="fmb">
    <div><label>Front</label><b class="num" id="yF">–</b></div>
    <div class="m"><label>Middle</label><b class="num" id="yM">–</b></div>
    <div><label>Back</label><b class="num" id="yB">–</b></div>
  </div>
  <div class="msg" id="msg">Finding your location…</div>
  <div class="tools">
    <button id="clear">Clear pins</button>
    <button id="markbtn" aria-pressed="false">Mark green</button>
    <button id="share">Share data</button>
    <a id="back" href="#" target="_blank" rel="noopener" hidden>Scores ↗</a>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-in">
    <h2>Green data</h2>
    <p id="modal-p">Copy this and send it to whoever maintains the site so everyone's phone gets your marks. Or paste data from someone else and tap Load.</p>
    <textarea id="dataout" spellcheck="false" aria-label="Green data"></textarea>
    <div class="row">
      <button class="primary" id="copy">Copy</button>
      <button id="load">Load pasted</button>
      <button id="close">Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---- config ---- */
const COURSES=[
  {id:"sheep",name:"Sheep Ranch"},
  {id:"trails",name:"Bandon Trails"},
  {id:"oldmac",name:"Old Macdonald"},
  {id:"dunes",name:"Bandon Dunes"},
  {id:"pacific",name:"Pacific Dunes"}
];
const RESORT=[43.196,-124.392];          // roughly the middle of the resort
const BATTLE_URL="https://claude.ai/artifact/B2NdN94uY5yzMmXPHQaE8c";
const YD=1.0936133;

/* ---- state ---- */
const st={course:"sheep",hole:1,me:null,acc:null,pins:[],marking:false,markStep:0,shared:{},local:{}};
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---- map ---- */
const map=L.map("map",{zoomControl:false,attributionControl:true,tap:true,maxZoom:21}).setView(RESORT,15);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
  maxNativeZoom:19,maxZoom:21,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"
}).addTo(map);
const lineLayer=L.layerGroup().addTo(map),greenLayer=L.layerGroup().addTo(map);
let meMarker=null,accCircle=null;

/* ---- distance ---- */
function yards(a,b){const R=6371008.8,t=Math.PI/180;
  const dLat=(b[0]-a[0])*t,dLon=(b[1]-a[1])*t;
  const h=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*YD}
const ll=p=>[p.lat,p.lng];

/* ---- greens data ---- */
const key=()=>st.course+"-"+st.hole;
function green(){return st.local[key()]||st.shared[key()]||null}
function allGreens(){return{...st.shared,...st.local}}
async function loadShared(){
  try{const r=await fetch("greens.json",{cache:"no-cache"});if(r.ok)st.shared=await r.json()}catch(e){}
  st.local=store.get("greens.local")||{};
  draw();
}

/* ---- drawing ---- */
function label(latlng,txt,sub){return L.marker(latlng,{interactive:false,icon:L.divIcon({className:"",html:`<div class="ylabel">${txt}${sub?`<small>${sub}</small>`:""}</div>`,iconSize:null,iconAnchor:[-8,14]})})}
function mid(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2]}
function draw(){
  $("hole").textContent=st.hole;$("course").value=st.course;
  greenLayer.clearLayers();lineLayer.clearLayers();
  const g=green();
  if(g)for(const k of ["F","M","B"])if(g[k])L.marker(g[k],{interactive:false,icon:L.divIcon({className:"",html:`<div class="gpt ${k}">${k}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}).addTo(greenLayer);
  // F/M/B readout
  for(const k of ["F","M","B"]){$("y"+k).textContent=(st.me&&g&&g[k])?Math.round(yards(st.me,g[k])):"–"}
  // pins and lines
  const start=st.me||(st.pins.length>1?st.pins[0]:null);
  const chain=st.me?[st.me,...st.pins]:st.pins;
  for(let i=1;i<chain.length;i++){
    L.polyline([chain[i-1],chain[i]],{color:"#FFD23F",weight:3,dashArray:"6 6",interactive:false}).addTo(lineLayer);
    label(mid(chain[i-1],chain[i]),Math.round(yards(chain[i-1],chain[i])),"yd").addTo(lineLayer);
  }
  st.pins.forEach((p,i)=>{
    const m=L.marker(p,{draggable:true,icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(lineLayer);
    m.on("drag",e=>{st.pins[i]=ll(e.target.getLatLng());redrawLines()});
    m.on("dragend",()=>draw());
  });
  // message
  const msg=$("msg");msg.classList.remove("warn");
  if(st.marking){msg.textContent=`Marking ${courseName()} #${st.hole}: tap the ${["FRONT","MIDDLE","BACK"][st.markStep]} of the green`;msg.classList.add("warn")}
  else if(!st.me){msg.textContent=st.gpsErr?st.gpsErr+" Tap two points to measure between them.":"Finding your location…";if(st.gpsErr)msg.classList.add("warn")}
  else if(st.pins.length){const tot=Math.round(yards(st.me,st.pins[st.pins.length-1]));msg.textContent=st.pins.length>1?`${tot} yd straight to the last pin · tap to add, Clear to reset`:"Drag the pin to adjust · tap again for a layup leg"}
  else msg.textContent=`GPS ±${Math.round((st.acc||0)*YD)} yd · tap the map for a distance`+(g?"":" · no green saved for this hole");
  const n=Object.keys(st.local).length;$("share").textContent=n?`Share data (${n})`:"Share data";
}
function redrawLines(){ // cheap redraw during drag
  lineLayer.eachLayer(l=>{if(!(l instanceof L.Marker&&l.dragging&&l.dragging.enabled()))lineLayer.removeLayer(l)});
  const chain=st.me?[st.me,...st.pins]:st.pins;
  for(let i=1;i<chain.length;i++){
    L.polyline([chain[i-1],chain[i]],{color:"#FFD23F",weight:3,dashArray:"6 6",interactive:false}).addTo(lineLayer);
    label(mid(chain[i-1],chain[i]),Math.round(yards(chain[i-1],chain[i])),"yd").addTo(lineLayer);
  }
}
const courseName=()=>COURSES.find(c=>c.id===st.course)?.name||"";

/* ---- interactions ---- */
map.on("click",e=>{
  const p=ll(e.latlng);
  if(st.marking){
    const k=["F","M","B"][st.markStep];
    const g={...(st.local[key()]||st.shared[key()]||{})};g[k]=[+p[0].toFixed(6),+p[1].toFixed(6)];
    st.local[key()]=g;store.set("greens.local",st.local);
    st.markStep++;
    if(st.markStep>2){st.markStep=0;if(st.hole<18){st.hole++;saveNav();flyToHole()}else{st.marking=false;$("markbtn").setAttribute("aria-pressed","false")}}
    draw();return;
  }
  if(st.pins.length>=(st.me?2:3))st.pins=[];
  st.pins.push(p);draw();
});
$("clear").onclick=()=>{st.pins=[];draw()};
$("markbtn").onclick=()=>{st.marking=!st.marking;st.markStep=0;st.pins=[];$("markbtn").setAttribute("aria-pressed",String(st.marking));if(st.marking)flyToHole(true);draw()};
$("prev").onclick=()=>{st.hole=st.hole<=1?18:st.hole-1;st.markStep=0;st.pins=[];saveNav();flyToHole();draw()};
$("next").onclick=()=>{st.hole=st.hole>=18?1:st.hole+1;st.markStep=0;st.pins=[];saveNav();flyToHole();draw()};
$("course").onchange=e=>{st.course=e.target.value;st.hole=1;st.pins=[];saveNav();flyToHole();draw()};
$("locate").onclick=()=>{if(st.me)map.setView(st.me,Math.max(map.getZoom(),17));else startGps(true)};
$("togreen").onclick=()=>flyToHole(true);
function flyToHole(force){
  const g=green();if(!g)return;const c=g.M||g.F||g.B;
  if(st.me&&!force&&yards(st.me,c)<700){map.fitBounds(L.latLngBounds([st.me,c]).pad(0.25),{maxZoom:19});return}
  map.setView(c,18);
}
function saveNav(){store.set("nav",{course:st.course,hole:st.hole});try{history.replaceState(null,"","#"+key())}catch(e){}}

/* ---- share / import ---- */
$("share").onclick=()=>{$("dataout").value=JSON.stringify(allGreens());$("modal").hidden=false};
$("close").onclick=()=>$("modal").hidden=true;
$("copy").onclick=async()=>{const t=$("dataout");try{await navigator.clipboard.writeText(t.value);$("copy").textContent="Copied"}catch(e){t.select();$("copy").textContent="Selected, copy it"}setTimeout(()=>$("copy").textContent="Copy",2000)};
$("load").onclick=()=>{try{const d=JSON.parse($("dataout").value);if(typeof d!=="object"||!d)throw 0;st.local={...st.local,...d};store.set("greens.local",st.local);$("modal").hidden=true;draw()}catch(e){$("modal-p").textContent="That text isn't valid green data. Paste the whole block exactly as it was copied."}};

/* ---- GPS ---- */
let watchId=null;
function startGps(center){
  if(!navigator.geolocation){st.gpsErr="This browser has no GPS access.";draw();return}
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);
  let first=true;
  watchId=navigator.geolocation.watchPosition(pos=>{
    st.me=[pos.coords.latitude,pos.coords.longitude];st.acc=pos.coords.accuracy;st.gpsErr=null;
    if(!meMarker){meMarker=L.marker(st.me,{interactive:false,zIndexOffset:1000,icon:L.divIcon({className:"",html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
      accCircle=L.circle(st.me,{radius:st.acc,color:"#3D8BFF",weight:1,fillOpacity:.12,interactive:false}).addTo(map)}
    else{meMarker.setLatLng(st.me);accCircle.setLatLng(st.me).setRadius(st.acc)}
    if(first&&(center||!green())){first=false;map.setView(st.me,17)}else if(first){first=false;flyToHole()}
    draw();
  },err=>{st.gpsErr=err.code===1?"Location is off for this site. Allow it in your browser settings.":"Can't get a GPS fix yet.";draw()},
  {enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}

/* ---- wake lock ---- */
let wl=null;async function wake(){try{if(!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>wl=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});

/* ---- boot ---- */
$("course").innerHTML=COURSES.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
const nav=store.get("nav");if(nav&&COURSES.some(c=>c.id===nav.course)){st.course=nav.course;st.hole=nav.hole||1}
const m=location.hash.match(/^#([a-z]+)-(\d{1,2})$/);if(m&&COURSES.some(c=>c.id===m[1])){st.course=m[1];st.hole=Math.min(18,Math.max(1,+m[2]))}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#([a-z]+)-(\d{1,2})$/);if(m&&COURSES.some(c=>c.id===m[1])){st.course=m[1];st.hole=+m[2];st.pins=[];flyToHole(true);draw()}});
if(BATTLE_URL){$("back").href=BATTLE_URL;$("back").hidden=false}
loadShared().then(()=>flyToHole(true));
startGps(false);wake();draw();
</script>
</body>
</html>
