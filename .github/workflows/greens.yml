name: Build greens from OpenStreetMap
on:
  workflow_dispatch:
  push:
    paths: ["tools/build_greens.py", ".github/workflows/greens.yml"]
permissions:
  contents: write
concurrency:
  group: greens
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_greens.py
      - name: Commit results
        run: |
          git config user.name "greens-bot"
          git config user.email "greens-bot@users.noreply.github.com"
          git add greens.json greens-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update greens from OpenStreetMap"
          # main may have moved while the build ran (it takes minutes when Overpass is slow)
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
